# roles/pxe/tasks/main.yml
---
- name: Install ca-certificates
  ansible.builtin.package:
    name: ca-certificates
    state: present

- name: Ensure CA certificates are up-to-date
  ansible.builtin.apt:
    name: ca-certificates
    state: latest
    update_cache: yes

- name: Install dnsmasq
  ansible.builtin.package:
    name: dnsmasq
    state: present
  notify: 
    - Enable dnsmasq

- name: Create TFTP root directory
  ansible.builtin.file:
    path: /srv/tftp
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download official iPXE core bootloaders
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "/srv/tftp/{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { url: 'https://boot.ipxe.org/x86_64-efi/ipxe.efi', dest: 'ipxe.efi' }
    - { url: 'https://boot.ipxe.org/undionly.kpxe', dest: 'undionly.kpxe' }

- name: Execute Smart Downloads for Distros
  ansible.builtin.include_tasks: downloads.yml

- name: Process Dynamic CachyOS ISO
  ansible.builtin.include_tasks: cachyos.yml

# /srv/tftp/coreboot is bind-mounted into the jenkins_server container, whose
# coreboot pipeline publishes ROMs + manifest.tsv here. It must be owned by the
# container's Jenkins uid; everything stays world-readable for HTTP/TFTP.
- name: Create Coreboot publish directory (owned by the Jenkins uid)
  ansible.builtin.file:
    path: /srv/tftp/coreboot
    state: directory
    owner: "{{ coreboot_publish_uid }}"
    group: "{{ coreboot_publish_gid }}"
    mode: '0755'

# The coreboot flasher is booted as Alpine + an apkovl overlay. Build that
# overlay from the repo so the flasher that runs is exactly flash_coreboot.sh,
# installed as an OpenRC local.d start script.
- name: Stage apkovl directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - "{{ apkovl_stage_dir }}/etc/local.d"
    - "{{ apkovl_stage_dir }}/etc/runlevels/default"

- name: Stage coreboot flasher as local.d start script
  ansible.builtin.copy:
    src: flash_coreboot.sh
    dest: "{{ apkovl_stage_dir }}/etc/local.d/flash_coreboot.start"
    owner: root
    group: root
    mode: '0755'
  register: apkovl_script

- name: Enable OpenRC 'local' service in the apkovl
  ansible.builtin.file:
    src: /etc/init.d/local
    dest: "{{ apkovl_stage_dir }}/etc/runlevels/default/local"
    state: link
    force: true
    follow: false
  register: apkovl_link

- name: Check for an existing apkovl
  ansible.builtin.stat:
    path: /srv/tftp/coreboot/alpine.apkovl.tar.gz
  register: apkovl_file

- name: Build alpine.apkovl.tar.gz
  ansible.builtin.command:
    cmd: >-
      tar --owner=0 --group=0 --numeric-owner -czf
      /srv/tftp/coreboot/alpine.apkovl.tar.gz -C {{ apkovl_stage_dir }} etc
  when: apkovl_script.changed or apkovl_link.changed or not apkovl_file.stat.exists
  changed_when: true

# The flasher used to be published here but nothing ever executed it (the
# apkovl carried its own copy). Remove it so there is one source of truth.
- name: Remove stale standalone flasher
  ansible.builtin.file:
    path: /srv/tftp/coreboot/flash_coreboot.sh
    state: absent

- name: Deploy dynamic iPXE menu
  ansible.builtin.template:
    src: boot.ipxe.j2
    dest: /srv/tftp/boot.ipxe
    owner: root
    group: root
    mode: '0644'

- name: Deploy dnsmasq configuration
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/pxe.conf
  notify: 
    - Restart dnsmasq

- name: List TFTP root entries for the security sweep
  ansible.builtin.find:
    paths: /srv/tftp
    file_type: any
    hidden: true
    recurse: false
  register: tftp_entries

# Everything under /srv/tftp is root-owned and read-only for others EXCEPT the
# Jenkins publish dir, which is excluded so the sweep doesn't take it back.
- name: Final security sweep - Ensure strict ownership and smart permissions on TFTP root
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: "{{ 'directory' if item.isdir else 'file' }}"
    owner: root
    group: root
    mode: 'u=rwX,g=rX,o=rX'
    recurse: "{{ item.isdir }}"
  loop: "{{ tftp_entries.files | rejectattr('path', 'equalto', '/srv/tftp/coreboot') | list }}"
  loop_control:
    label: "{{ item.path }}"